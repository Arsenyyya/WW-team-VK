[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vk-case"
version = "0.1.0"
description = "Reproducible VK Case Champ research and local product prototype"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pandas>=2.2,<3", "numpy>=1.26,<3", "openpyxl>=3.1,<4",
  "pyarrow>=18", "scipy>=1.14", "statsmodels>=0.14", "matplotlib>=3.9",
  "streamlit>=1.41", "reportlab>=4.2", "pypdf>=5", "python-pptx>=1",
  "PyYAML>=6"
]

[project.scripts]
vk-case = "vk_case.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "playwright>=1.49", "pymupdf>=1.25,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
exclude = [".vendor", ".venv", "data", "outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

